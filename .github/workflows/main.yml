name: CI/CD Pipeline - Docker Hub

# 1. Sự kiện kích hoạt: Workflow sẽ chạy khi bạn push code lên nhánh 'main'
on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Kéo source code từ GitHub về máy chủ chạy workflow
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt công cụ Docker Buildx để build image nhanh và tối ưu hơn
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 3: Đăng nhập vào Docker Hub (Sử dụng biến bảo mật)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Bước 4: Khởi chạy build từ Dockerfile và push lên Hub
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: dglocson/springboot-demo:v1
