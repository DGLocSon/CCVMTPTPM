name: Build and Push to Docker Hub

# Kích hoạt workflow khi có code mới đẩy lên nhánh 'main'
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Kéo source code về máy ảo của GitHub
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Setup công cụ build Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Đăng nhập vào Docker Hub bằng tài khoản của bạn
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build từ Dockerfile và Push thẳng lên Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Thay 'dglocson/springboot-demo:v1' bằng tag bạn muốn (có thể dùng 'latest')
          tags: dglocson/springboot-demo:v1
