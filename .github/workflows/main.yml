name: CI with Multi-stage Docker

on:
  push:
    branches: [ "develop" ]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code về
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Cấu hình Docker Buildx (công cụ chuyên dụng để build image)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Kích hoạt build từ Dockerfile của bạn
      - name: Build Docker Image
        run: |
          docker build -t clinic-booking-backend:latest .
          docker images # Liệt kê image để kiểm tra dung lượng
