<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ của tôi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/account.css">
</head>
<body class="account-body">
  <div class="profile-page">
    <div class="profile-shell">
      <header class="profile-top">
        <a href="/" class="profile-back" aria-label="Quay lại">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </a>
        <h1>Hồ Sơ Của Tôi</h1>
      </header>

      <div class="profile-grid">
        <div class="profile-col profile-col--main">
          <form id="profile-form" action="#" method="post" autocomplete="on">
            <h2 class="profile-section-title">Thông tin chung</h2>

            <div class="profile-row-2">
              <div class="profile-field">
                <label for="prof-email">Email Đăng Nhập</label>
                <input id="prof-email" name="email" type="email" value="A@gmail.com" readonly>
              </div>
              <div class="profile-field">
                <label for="prof-role">Vai Trò</label>
                <input id="prof-role" name="role" type="text" value="Khách hàng" readonly>
              </div>
            </div>

            <div class="profile-field">
              <label for="prof-name">Họ Và Tên</label>
              <div class="profile-input-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
                <input id="prof-name" name="fullName" type="text" value="Nguyễn Văn A" readonly>
              </div>
            </div>

            <div class="profile-field">
              <label for="prof-phone">Số điện thoại</label>
              <div class="profile-input-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
                <input id="prof-phone" name="phone" type="tel" value="0987654321" readonly>
              </div>
            </div>

            <div class="profile-field">
              <label for="prof-address">Địa chỉ</label>
              <div class="profile-input-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                  <circle cx="12" cy="10" r="3"/>
                </svg>
                <input id="prof-address" name="address" type="text" value="TP Hồ Chí Minh" readonly>
              </div>
            </div>

            <div class="profile-actions">
              <button type="button" class="btn-profile-edit">Sửa thông tin</button>
              <button type="submit" class="btn-profile-save">Lưu thông tin</button>
            </div>
          </form>
        </div>

        <div class="profile-col">
          <h2 class="profile-section-title profile-section-title--dark">Ảnh Đại Diện</h2>
          <div class="avatar-wrap">
            <img src="https://picsum.photos/seed/profileavatar/400/400" width="400" height="400" alt="Ảnh đại diện">
          </div>
          <button type="button" class="btn-avatar">Chỉnh sửa ảnh</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var edit = document.querySelector(".btn-profile-edit");
      if (!edit) return;
      var fields = ["prof-name", "prof-phone", "prof-address"].map(function (id) {
        return document.getElementById(id);
      }).filter(Boolean);
      edit.addEventListener("click", function () {
        fields.forEach(function (el) {
          el.removeAttribute("readonly");
        });
        if (fields[0]) fields[0].focus();
      });
    })();
  </script>
</body>
</html>
