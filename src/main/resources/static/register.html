<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/register.css">
</head>
<body>
  <main class="register-page">
    <section class="register-card" aria-labelledby="register-title">
      <h1 id="register-title" class="visually-hidden">Đăng ký tài khoản</h1>

      <form class="register-form" action="#" method="post">
        <div class="field">
          <label for="phone">Số điện thoại</label>
          <input id="phone" name="phone" type="tel" placeholder="Số điện thoại" autocomplete="tel" required>
        </div>

        <div class="field">
          <label for="fullname">Họ và tên</label>
          <input id="fullname" name="fullname" type="text" placeholder="Nguyễn Văn A" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="example@gmail.com" autocomplete="email" required>
        </div>

        <fieldset class="field field-inline">
          <legend>Ngày sinh</legend>
          <div class="field-inline-group">
            <input id="dob-day" name="dobDay" type="text" inputmode="numeric" maxlength="2" placeholder="DD" aria-label="Ngày sinh - ngày" required>
            <input id="dob-month" name="dobMonth" type="text" inputmode="numeric" maxlength="2" placeholder="MM" aria-label="Ngày sinh - tháng" required>
            <input id="dob-year" name="dobYear" type="text" inputmode="numeric" maxlength="4" placeholder="YYYY" aria-label="Ngày sinh - năm" required>
          </div>
        </fieldset>

        <div class="field">
          <label for="region">Khu vực</label>
          <select id="region" name="region" required>
            <option value="" selected disabled>Khu vực</option>
            <option value="hcm">TP. Hồ Chí Minh</option>
            <option value="hn">Hà Nội</option>
            <option value="dn">Đà Nẵng</option>
          </select>
        </div>

        <div class="field field-password">
          <label for="password">Mật khẩu</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" placeholder="********" autocomplete="new-password" required>
            <button class="password-toggle" type="button" aria-label="Hiện mật khẩu">
              <span aria-hidden="true">Show</span>
            </button>
          </div>
        </div>

        <label class="checkbox-field" for="agree-terms">
          <input id="agree-terms" name="agreeTerms" type="checkbox" required>
          <span>Tôi đồng ý với các điều khoản.</span>
        </label>

        <button class="register-btn" type="submit">Đăng ký</button>
      </form>
    </section>
  </main>
</body>
</html>
