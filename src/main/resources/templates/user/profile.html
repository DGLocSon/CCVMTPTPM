<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Của Tôi</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #3498db;
            --text-dark: #333;
            --text-gray: #666;
            --input-bg: #f0f4f7;
            --yellow-btn: #f1c40f; /* Refined yellow */
            --green-btn: #2ecc71; /* Refined green */
            --gray-btn: #95a5a6; /* Refined gray */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #fff;
            color: var(--text-dark);
            min-height: 100vh;
        }

        /* Header Styles */
        .profile-header {
            display: flex;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 2px solid #eee;
        }

        .back-icon {
            width: 34px;
            height: 34px;
            margin-right: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #555;
            border-radius: 50%;
        }

        .back-icon svg {
            width: 20px;
            height: 20px;
            fill: #333;
        }

        .profile-header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        /* Main Content Grid */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 340px;
            padding: 40px;
            gap: 40px;
        }

        .left-column {
            padding-right: 40px;
        }

        .right-column {
            border-left: 1px solid #ddd;
            padding-left: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Sidebar/Left Column Form */
        .section-subtitle {
            color: var(--primary-blue);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 50px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .label {
            display: block;
            font-size: 0.95rem;
            margin-bottom: 10px;
            font-weight: 500;
            color: #444;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-container input {
            width: 100%;
            height: 48px;
            padding: 0 15px 0 50px;
            border: none;
            border-radius: 14px;
            background-color: var(--input-bg);
            font-size: 1rem;
            color: #333;
            outline: none;
        }

        .input-container .icon {
            position: absolute;
            left: 15px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon svg {
            width: 100%;
            height: 100%;
            fill: #555;
        }

        /* Two column specialized input style for email/role */
        .simple-input {
            padding-left: 20px !important;
        }

        /* Profile Image section */
        .img-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 60px;
        }

        .avatar-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 40px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Buttons Container */
        .button-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
        }

        .btn {
            padding: 12px 35px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-yellow {
            background-color: var(--yellow-btn);
            color: #000;
        }
        .btn-yellow:hover { background-color: #fce300; }

        .btn-green {
            background-color: var(--green-btn);
            color: #fff;
        }
        .btn-green:hover { background-color: #27ae60; }

        .btn-gray {
            background-color: #999;
            color: #000;
            padding: 10px 25px;
            font-size: 1rem;
        }
        .btn-gray:hover { background-color: #888; }

    </style>
</head>
<body>

    <header class="profile-header">
        <div class="back-icon">
            <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
        </div>
        <h1>Hồ Sơ Của Tôi</h1>
    </header>

    <main class="main-container">
        <!-- Left Side -->
        <section class="left-column">
            <h2 class="section-subtitle">Thông tin chung</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="label">Email Đăng Nhập</label>
                    <div class="input-container">
                        <input type="text" class="simple-input" value="A@gmail.com" readonly>
                    </div>
                </div>
                <div class="form-group">
                    <label class="label">Vai Trò</label>
                    <div class="input-container">
                        <input type="text" class="simple-input" value="Khách hàng" readonly>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="label">Họ Và Tên</label>
                <div class="input-container">
                    <span class="icon">
                        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </span>
                    <input type="text" value="Nguyễn Văn A">
                </div>
            </div>

            <div class="form-group">
                <label class="label">Số điện thoại</label>
                <div class="input-container">
                    <span class="icon">
                        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                    </span>
                    <input type="text" value="0987654321">
                </div>
            </div>

            <div class="form-group">
                <label class="label">Địa chỉ</label>
                <div class="input-container">
                    <span class="icon">
                        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    </span>
                    <input type="text" value="TP Hồ Chí Minh">
                </div>
            </div>

            <div class="button-bar">
                <button class="btn btn-yellow">Sửa thông tin</button>
                <button class="btn btn-green">Lưu thông tin</button>
            </div>
        </section>

        <!-- Right Side -->
        <section class="right-column">
            <h2 class="img-title">Ảnh Đại Diện</h2>
            <div class="avatar-circle">
                <img src="https://via.placeholder.com/180" alt="Avatar">
            </div>
            <button class="btn btn-gray">Chỉnh sửa ảnh</button>
        </section>
    </main>

</body>
</html>
