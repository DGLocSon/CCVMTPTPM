<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán Thành Công - CGV Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle, #3a0d0d 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .title-glow {
            color: #00FF00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.7), 0 0 20px rgba(0, 255, 0, 0.5);
            font-weight: 800;
            letter-spacing: 2px;
        }

        .ticket-card {
            background-color: #1a1a1a;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-top: 30px;
        }

        .ticket-header {
            color: #FFD700;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .qr-container {
            background-color: white;
            padding: 10px;
            border-radius: 8px;
            width: fit-content;
            margin: 0 auto 20px auto;
        }

        .movie-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .label {
            color: #a0a0a0;
        }

        .value {
            color: white;
            text-align: right;
            font-weight: 500;
        }

        .seat-badge {
            background-color: #E50914;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 5px;
            font-size: 0.8rem;
        }

        .highlight-yellow {
            color: #FFD700;
            font-weight: bold;
        }

        .btn-home {
            background-color: #E50914;
            color: white;
            padding: 12px 40px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 40px;
            transition: background-color 0.3s;
            width: 100%;
            max-width: 280px;
            text-align: center;
        }

        .btn-home:hover {
            background-color: #b20710;
        }

        .sub-message {
            color: #d1d1d1;
            text-align: center;
            font-size: 0.85rem;
            max-width: 400px;
            margin-top: 10px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1 class="text-4xl md:text-5xl title-glow">THANH TOÁN THÀNH CÔNG</h1>
    
    <p class="sub-message">
        Vé của bạn đã được đặt thành công. Vui lòng xuất trình mã QR hoặc mã đặt vé tại quầy để nhận vé.
    </p>

    <div class="ticket-card">
        <div class="ticket-header">VÉ ĐIỆN TỬ</div>
        
        <div class="qr-container">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=MATRIX-2026-D7D8" alt="QR Code Ticket">
        </div>

        <div class="movie-title">THE MATRIX RESURRECTIONS</div>

        <div class="info-row">
            <span class="label">Rạp chiếu</span>
            <span class="value">CGV Vincom Center</span>
        </div>

        <div class="info-row">
            <span class="label">Phòng chiếu</span>
            <span class="value">Rạp 3</span>
        </div>

        <div class="info-row">
            <span class="label">Ghế ngồi</span>
            <div class="value">
                <span class="seat-badge">D7</span>
                <span class="seat-badge">D8</span>
            </div>
        </div>

        <div class="info-row">
            <span class="label">Suất chiếu</span>
            <span class="value highlight-yellow">19:30 - T7, 25/01/2026</span>
        </div>

        <div class="info-row">
            <span class="label">Tổng tiền</span>
            <span class="value highlight-yellow text-xl">275.000đ</span>
        </div>
    </div>

    <a href="../common/index.html" class="btn-home">TRỞ VỀ TRANG CHỦ</a>

</body>
</html>
