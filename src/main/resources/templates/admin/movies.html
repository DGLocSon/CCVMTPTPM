<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Phim</title>
  <link rel="stylesheet" href="css/admin.css">
</head>

<body class="admin-page">
  <main class="admin-wrapper">
    <section class="admin-top">
      <h1 class="admin-greeting">🐣 XIN CHÀO ADMIN!</h1>
      <h2 class="movie-header">QUẢN LÝ PHIM</h2>
    </section>

    <section class="admin-layout">
      <aside>
        <h2 class="menu-title">MENU</h2>
        <ul class="menu-list">
          <li>PHIM</li>
          <li>PHÒNG CHIẾU</li>
          <li>DOANH THU</li>
        </ul>
      </aside>

      <div>
        <div class="tool-row">
          <button class="tool-btn" type="button">+ Thêm mới</button>
          <button class="tool-btn" type="button">Xóa tất cả</button>
        </div>

        <div class="movie-search">
          <label for="category-search">Tìm kiếm danh mục</label>
          <div class="movie-search-box">
            <input id="category-search" type="text" value="Tìm kiếm">
            <button type="button">🔍</button>
          </div>
        </div>
      </div>
    </section>

    <h3 class="section-title">Danh sách phim</h3>
    <section class="movie-grid">
      <article class="movie-card">
        <img src="https://images.unsplash.com/photo-1608889476518-738c9b1dcbff?auto=format&fit=crop&w=420&q=80"
          alt="Poster Vĩnh Sinh">
        <p class="name">Vĩnh Sinh: Khí Tràng ...</p>
        <p class="meta">Immortality (2023)</p>
      </article>
      <article class="movie-card">
        <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=420&q=80"
          alt="Poster Cái Chết Của Singsala">
        <p class="name">Cái Chết Của Singsala</p>
        <p class="meta">Goddess Bless You fro...</p>
      </article>
      <article class="movie-card">
        <img src="https://images.unsplash.com/photo-1594908900066-3f47337549d8?auto=format&fit=crop&w=420&q=80"
          alt="Poster Trường Hạ Lạc Nhật">
        <p class="name">Trường Hạ Lạc Nhật</p>
        <p class="meta">River Sunset (2026)</p>
      </article>
      <article class="movie-card">
        <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=420&q=80"
          alt="Poster Ultraman Omega">
        <p class="name">Ultraman Omega</p>
        <p class="meta">Ultraman Omega (2025)</p>
      </article>
    </section>
  </main>
</body>

</html>
