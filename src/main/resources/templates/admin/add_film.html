<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thêm Phim Mới</title>
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .film-form {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 32px;
      background: #fff;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 14px 50px rgba(0, 0, 0, 0.08);
    }

    .poster-panel {
      border: 2px dashed #bbb;
      border-radius: 20px;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #888;
      text-align: center;
      padding: 24px;
      background: #f9f9f9;
    }

    .poster-panel i {
      font-size: 52px;
    }

    .poster-panel span {
      font-size: 20px;
      font-weight: 700;
    }

    .poster-panel small {
      display: block;
      color: #666;
      margin-top: 14px;
    }

    .field-grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .field-group {
      display: grid;
      gap: 8px;
    }

    .field-group label {
      font-size: 18px;
      font-weight: 700;
      color: #333;
    }

    .field-group input,
    .field-group select,
    .field-group textarea {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
      color: #111;
      background: #fafafa;
      box-sizing: border-box;
    }

    .field-group textarea {
      min-height: 160px;
      resize: vertical;
    }

    .field-full {
      grid-column: 1 / -1;
    }

    .form-actions {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-primary,
    .btn-secondary {
      min-width: 160px;
      height: 52px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-secondary {
      background: #f2f2f2;
      color: #333;
    }

    .btn-primary {
      background: #0f62fe;
      color: #fff;
    }
  </style>
</head>

<body class="admin-page">
  <main class="admin-wrapper">
    <section class="admin-top">
      <div>
        <h1 class="admin-greeting">Thêm Phim Mới</h1>
        <h2 class="movie-header">Tạo hồ sơ phim</h2>
      </div>
    </section>

    <form class="film-form" action="#" method="post" enctype="multipart/form-data">
      <div class="poster-panel">
        <i class="fa-regular fa-image" aria-hidden="true"></i>
        <span>Tải lên Poster</span>
        <input type="file" name="poster" accept="image/*" style="margin-top: 16px;">
        <small>Kích thước chuẩn: 1000×1500px</small>
      </div>

      <div>
        <div class="field-grid">
          <div class="field-group field-full">
            <label for="title">Tên phim chính thức *</label>
            <input id="title" name="title" type="text" placeholder="Nhập tên phim" required>
          </div>

          <div class="field-group">
            <label for="genre">Phân loại (Genre)</label>
            <input id="genre" name="genre" type="text" placeholder="Phiêu lưu, Tình cảm">
          </div>

          <div class="field-group">
            <label for="rating">Tùy chọn phụ</label>
            <input id="rating" name="rating" type="text" placeholder="T16">
          </div>

          <div class="field-group">
            <label for="country">Quốc gia</label>
            <input id="country" name="country" type="text" placeholder="Việt Nam">
          </div>

          <div class="field-group">
            <label for="duration">Thời lượng (Phút)</label>
            <input id="duration" name="duration" type="number" min="0" placeholder="113">
          </div>

          <div class="field-group">
            <label for="releaseDate">Ngày công chiếu</label>
            <input id="releaseDate" name="releaseDate" type="date">
          </div>

          <div class="field-group field-full">
            <label for="credits">Diễn viên & Đạo diễn chính</label>
            <input id="credits" name="credits" type="text"
              placeholder="Hoàng Tuấn Cường, Quang Tuấn, Hoài Lâm, Quách Ngọc Ngoan">
          </div>

          <div class="field-group field-full">
            <label for="summary">Tóm tắt nội dung phim *</label>
            <textarea id="summary" name="summary" placeholder="Nhập tóm tắt nội dung phim" required></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="reset" class="btn-secondary">Làm trắng</button>
          <button type="submit" class="btn-primary">Lưu thông tin</button>
        </div>
      </div>
    </form>
  </main>
</body>

</html>
