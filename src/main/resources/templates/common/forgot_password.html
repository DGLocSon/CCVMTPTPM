<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu</title>
    <!-- Modern font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfcfc;
            /* Exact colors from the image */
            --card-blue: #3FA1CF; 
            --btn-purple: #5B11FF;
            --link-blue: #4AC1FF;
            --text-dark: #222222;
            --input-bg-opacity: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-title {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 50px;
            /* Slightly letter spaced as in the image */
            letter-spacing: -0.5px;
        }

        .login-card {
            background-color: var(--card-blue);
            width: 100%;
            padding: 60px 45px 40px 45px;
            border-radius: 4px; /* Minimal rounding like in image */
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
        }

        .input-group {
            margin-bottom: 30px;
        }

        .input-label {
            display: block;
            color: white;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .field-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-container input {
            width: 100%;
            height: 48px;
            padding: 0 15px 0 50px;
            border: none;
            border-radius: 10px; /* Slightly more rounded inputs like image */
            background-color: var(--input-bg-opacity);
            color: #1a1a1a;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        .field-container input:focus {
            background-color: rgba(255, 255, 255, 0.55);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
        }

        .icon-box {
            position: absolute;
            left: 14px;
            width: 24px;
            height: 24px;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-box svg {
            width: 85%;
            height: 85%;
            fill: #333;
        }

        .action-button {
            width: 100%;
            height: 54px;
            background-color: var(--btn-purple);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            margin-bottom: 30px;
            transition: all 0.2s ease;
        }

        .action-button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .action-button:active {
            transform: translateY(0);
        }

        .footer-nav {
            text-align: center;
            font-size: 13.5px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
        }

        .footer-nav a {
            color: var(--link-blue);
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
        }

        .footer-nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="main-title">Quên Mật Khẩu</h1>
        
        <div class="login-card">
            <form action="/forgot-password" method="POST">
                
                <!-- Email Field -->
                <div class="input-group">
                    <label class="input-label">Nhập Email</label>
                    <div class="field-container">
                        <div class="icon-box">
                            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        </div>
                        <input type="email" name="email" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="input-group">
                    <label class="input-label">Nhập mật khẩu mới</label>
                    <div class="field-container">
                        <div class="icon-box">
                            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
                        </div>
                        <input type="password" name="new_password" required>
                    </div>
                </div>

                <button type="submit" class="action-button">Xác nhận đổi mật khẩu</button>

                <div class="footer-nav">
                    Bạn đã có tài khoản chưa ? <a href="/login">Đăng ký</a>
                </div>

            </form>
        </div>
    </div>

</body>
</html>
